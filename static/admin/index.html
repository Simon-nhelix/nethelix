<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>nethelix 댓글 관리</title>
<style>
body{font:15px/1.5 system-ui,-apple-system,sans-serif;max-width:860px;margin:24px auto;padding:0 16px;color:#222;background:#fafafa}
h1{font-size:20px}input,button,select{font:inherit;padding:6px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.item{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px 14px;margin:10px 0}
.meta{font-size:13px;color:#666;display:flex;gap:10px;flex-wrap:wrap}.body{white-space:pre-wrap;margin:8px 0}
.act button{margin-right:6px}.ok{color:#177245}.pending{color:#b26a00}.rejected{color:#999}
</style></head><body>
<h1>nethelix 댓글 관리</h1>
<div class="row"><input id="token" type="password" placeholder="ADMIN_TOKEN" size="36"><button id="save">저장</button>
<select id="status"><option value="pending">대기</option><option value="approved">공개</option><option value="rejected">거절</option><option value="all">전체</option></select>
<button id="reload">새로고침</button><span id="msg"></span></div>
<div id="list"></div>
<script>
const $=s=>document.querySelector(s);const tokenEl=$('#token');tokenEl.value=localStorage.getItem('nethelix_admin_token')||'';
$('#save').onclick=()=>{localStorage.setItem('nethelix_admin_token',tokenEl.value);load();};
$('#reload').onclick=load;$('#status').onchange=load;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hdr=()=>({'authorization':'Bearer '+tokenEl.value,'content-type':'application/json'});
async function load(){$('#msg').textContent='불러오는 중…';try{const r=await fetch('/api/admin/comments?status='+$('#status').value,{headers:hdr()});const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);$('#msg').textContent=d.comments.length+'개';
$('#list').innerHTML=d.comments.map(c=>`<div class="item"><div class="meta"><b>${esc(c.name)}</b><span>${esc(c.page)}</span><span>${esc(c.created_at)} UTC</span><span class="${c.status==='approved'?'ok':c.status}">${c.status}</span></div><div class="body">${esc(c.body)}</div><div class="act"><button data-a="approve" data-id="${c.id}">공개</button><button data-a="reject" data-id="${c.id}">거절</button><button data-a="delete" data-id="${c.id}">삭제</button></div></div>`).join('')||'<p>없음</p>';
}catch(e){$('#msg').textContent='오류: '+e.message;}}
$('#list').onclick=async e=>{const b=e.target.closest('button[data-a]');if(!b)return;if(b.dataset.a==='delete'&&!confirm('삭제할까요?'))return;
const r=await fetch('/api/admin/comments',{method:'POST',headers:hdr(),body:JSON.stringify({id:Number(b.dataset.id),action:b.dataset.a})});if(!r.ok){alert('실패 '+r.status);return;}load();};
if(tokenEl.value)load();
</script></body></html>
